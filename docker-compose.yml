version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: localservice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: localservice
      POSTGRES_USER: localservice
      POSTGRES_PASSWORD: localservice
    ports:
      - '5431:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: localservice-backend
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/localservice
      PORT: 8089
    ports:
      - '8089:8089'

  frontend:
    build:
      context: ./front-end
      args:
        VITE_API_BASE_URL: http://localhost:8089
    container_name: localservice-frontend
    depends_on:
      - backend
    env_file:
      - ./front-end/.env
    environment:
      PORT: 5171
    ports:
      - '5171:5171'

volumes:
  postgres_data:
